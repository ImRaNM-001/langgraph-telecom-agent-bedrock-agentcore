default_agent: lauki_telecom_agent_lang_runtime
agents:
  lauki_telecom_agent_lang_runtime:
    name: lauki_telecom_agent_lang_runtime
    language: python
    node_version: '20'
    entrypoint: <PROJECT_DIR_ABSOLUTE_PATH>/src/main.py  
    deployment_type: container
    runtime_type: null
    platform: linux/arm64
    container_runtime: none
    source_path: <PROJECT_DIR_ABSOLUTE_PATH>
    aws:
      execution_role: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/<ROLE_NAME>
      execution_role_auto_create: false
      account: '<YOUR_AWS_ACCOUNT_ID>'
      region: <YOUR_AWS_REGION>
      ecr_repository: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.<YOUR_AWS_REGION>.amazonaws.com/<REPOSITORY_NAME>
      ecr_auto_create: false
      s3_path: null
      s3_auto_create: false
      network_configuration:
        network_mode: PUBLIC
        network_mode_config: null
      protocol_configuration:
        server_protocol: HTTP
      observability:
        enabled: true
      lifecycle_configuration:
        idle_runtime_session_timeout: null
        max_lifetime: null
    bedrock_agentcore:
      agent_id: <AGENT_ID>
      agent_arn: arn:aws:bedrock-agentcore:<YOUR_AWS_REGION>:<YOUR_AWS_ACCOUNT_ID>:runtime/<AGENT_RUNTIME_NAME>
      agent_session_id: null
    codebuild:
      project_name: bedrock-agentcore-lauki_telecom_agent_lang_runtime-builder
      execution_role: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/AmazonBedrockAgentCoreSDKCodeBuild-<YOUR_AWS_REGION>-xxxxx
      source_bucket: bedrock-agentcore-codebuild-sources-<YOUR_AWS_ACCOUNT_ID>-<YOUR_AWS_REGION>
    memory:
      mode: STM_AND_LTM
      memory_id: <AGENT_MEMORY_ID>
      memory_arn: null
      memory_name: <AGENT_MEMORY_NAME>
      event_expiry_days: 30
      first_invoke_memory_check_done: false
      was_created_by_toolkit: false
    identity:
      credential_providers: []
      workload: null
    aws_jwt:
      enabled: false
      audiences: []
      signing_algorithm: ES384
      issuer_url: null
      duration_seconds: 300
    authorizer_configuration: null
    request_header_configuration: null
    oauth_configuration: null
    api_key_env_var_name: null
    api_key_credential_provider_name: null
    is_generated_by_agentcore_create: false
