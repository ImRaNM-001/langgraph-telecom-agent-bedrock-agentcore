    "bedrock-agentcore-starter-toolkit>=0.2.0",
    "faiss-cpu>=1.13.0",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.0",
    "langchain-huggingface>=1.1.0",
    "langchain[aws]>=1.1.0",
    "langgraph>=1.0.4",
    "langgraph-checkpoint-aws>=1.0.1",
    "sentence-transformers>=5.1.2",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "ensure>=1.0.4",
    "python-box>=7.3.2",
    "boto3>=1.38.0",
]
